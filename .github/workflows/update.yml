name: Update algorithms

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Mask project ID
        run: echo "::add-mask::$(jq -r .project_id <<< "$EE_SERVICE_ACCOUNT")"
        env:
          EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.EE_SERVICE_ACCOUNT }}

      - name: Fetch algorithms
        run: |
          curl -fsS -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://earthengine.googleapis.com/v1/projects/$GOOGLE_CLOUD_PROJECT/algorithms" \
            | jq . > algorithms.json

      - name: Commit on change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add algorithms.json
          git diff --cached --quiet || { git commit -m "Algorithms updated $(date -u)"; git push; }
